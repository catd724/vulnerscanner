<!--
  AI Terminal brand mark.
  Shield + terminal prompt + radar scan line.
  Replace this file (keep the 64x64 viewBox) and every surface picks it up.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AI Terminal">
  <defs>
    <linearGradient id="at-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="at-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 242, 254, 0.2)"/>
      <stop offset="100%" stop-color="rgba(79, 172, 254, 0.05)"/>
    </linearGradient>
  </defs>

  <!-- Shield outline -->
  <path d="M32 4 L56 14 V30 C56 44 46 56 32 60 C18 56 8 44 8 30 V14 Z"
        fill="url(#at-shield)" stroke="url(#at-brand)" stroke-width="2.5"
        stroke-linejoin="round"/>

  <!-- Radar scan arc -->
  <path d="M18 28 C18 20 24 14 32 14 C40 14 46 20 46 28"
        fill="none" stroke="#00ff87" stroke-width="2" stroke-linecap="round"
        opacity="0.9"/>

  <!-- Terminal prompt -->
  <path d="M20 34 L27 40 L20 46" fill="none" stroke="#f3f4f6" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="30" y1="46" x2="42" y2="46" stroke="#f3f4f6" stroke-width="3"
        stroke-linecap="round"/>

  <!-- Scan pulse dot -->
  <circle cx="44" cy="22" r="3" fill="#00ff87"/>
</svg>
